[graph]
# Only the platforms we build for: webpki-root-certs (CDLA-Permissive-2.0) appears only under wasm32.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
version = 2
# "Unmaintained" notices for crates that only reach us through Tauri on Linux.
# They are not vulnerabilities and cannot be fixed here; review this list when Tauri is upgraded.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time only, pulled in by the gtk-rs crates under tauri" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: pulled in by zbus under tauri-plugin-opener" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: pulled in by zbus under tauri-plugin-opener" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: pulled in by zbus under tauri-plugin-opener" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "GPL-3.0-or-later",
  "CC0-1.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
