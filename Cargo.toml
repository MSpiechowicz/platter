[workspace]
resolver = "3"
members = ["crates/platter-core", "crates/platter-platform", "crates/platter-rules", "crates/platter-cleanup", "crates/platter-history", "crates/platter-ai", "crates/platter-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.25"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/MSpiechowicz/platter"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
platter-core = { path = "crates/platter-core" }
platter-platform = { path = "crates/platter-platform" }
platter-rules = { path = "crates/platter-rules" }
platter-cleanup = { path = "crates/platter-cleanup" }
platter-history = { path = "crates/platter-history" }
platter-ai = { path = "crates/platter-ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
rustix = { version = "1", features = ["fs"] }
sysinfo = { version = "0.40", default-features = false, features = ["disk", "system"] }
# Windows only (platter-platform): safe wrappers over the Windows API, because `unsafe` is forbidden here.
winapi-util = "0.1"
dunce = "1"
trash = "5"
runas = "1.2"
win32job = "2"
known-folders = "1"
jiff = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
llama-cpp-2 = { version = "=0.1.161", default-features = false, features = ["common"] }
# Pinned on its own: the build script compiles llama.cpp from source, so the exact version is reviewed.
llama-cpp-sys-2 = "=0.1.161"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
# Pinned on its own: SQLite is compiled from the bundled C source (no system library), so the exact version is reviewed.
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }
# Pinned on its own like the other crates that build C: the saved scan (`last-scan.bin`) is compressed with zstd, and `zstd-sys`
# builds the C library from source, so the exact version is reviewed.
zstd = { version = "=0.14.4", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
