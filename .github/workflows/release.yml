name: Release

# Builds the Linux packages (AppImage, deb, rpm), the Windows setup (NSIS, for the current user) and the Mac
# app (dmg and an app tarball, Apple Silicon) for a version tag and puts them, with SHA256SUMS, on a GitHub
# release. The Mac build never blocks the others: if it fails, the release goes out without it.
#
# Two ways in:
# - version.yml calls it after a merge to main raised the version and pushed the tag (`publish: true`: the
#   release is published at once, so installed copies are offered the update).
# - A tag pushed by hand (git tag -a v0.2.0 -m "..." && git push origin v0.2.0) makes a draft that is
#   published by hand after the packages were tried.
#
# No tests run here: CI ran them on Linux, Windows and macOS before version.yml tagged the commit, and the
# release commit only raises the version. A tag pushed by hand is not checked by CI: push it on a commit
# whose CI run passed.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "The version tag to build (v0.2.0). It must already be pushed."
        required: true
        type: string
      publish:
        description: "Publish the release when every job passed, instead of leaving a draft."
        required: false
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: Linux packages
    # The oldest supported runner: the AppImage runs on systems with this glibc or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    # Dependencies' install and build scripts run here: this job can read the repository only. The release
    # is made by the next job, which runs no code from dependencies.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Called from version.yml the run's ref is main: build exactly what the tag names.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      # The tag must name the version the packages carry (the workspace version in Cargo.toml).
      - name: Check the tag against the version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match the version $version in Cargo.toml."
            exit 1
          fi

      # llama-cpp-sys-2 passes every GGML_* variable to CMake (debug and validation switches among them).
      # A release is built without any, so every build of a version is the same.
      - name: Refuse GGML variables in the environment
        run: |
          if env | grep -q '^GGML_'; then
            env | grep '^GGML_' | cut -d= -f1
            echo "::error::GGML_* variables are set. The release must be built without them."
            exit 1
          fi

      - name: Install Linux build dependencies
        # The script stops a hung apt itself: this is the last stop, well short of the job's limit.
        timeout-minutes: 25
        run: scripts/ci/install-linux-deps.sh

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install --profile minimal

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # No cache on purpose: a release is built from a clean target folder. The AppImage does not carry the
      # Vulkan loader: the system's one matches the system's drivers, and is new enough to honour
      # VK_LOADER_LAYERS_DISABLE (the runner's 1.3.204 is not).
      - name: Build the packages
        env:
          LINUXDEPLOY_EXCLUDED_LIBRARIES: "libvulkan.so*"
        run: pnpm -C apps/desktop tauri build --ci

      - name: Collect the packages
        run: |
          mkdir packages
          cp target/release/bundle/appimage/*.AppImage packages/
          cp target/release/bundle/deb/*.deb packages/
          cp target/release/bundle/rpm/*.rpm packages/
          ls -l packages

      # The deb and rpm carry the root helper and its polkit policy (tauri.linux.conf.json builds the helper
      # before bundling). Without them the cleanup would ask for the password once per tool, or the policy
      # would name a program that is not there. The helper must be root's and not writable by anyone else.
      - name: Check the helper and the policy are in the packages
        run: |
          helper=/usr/lib/platter/platter-elevate
          policy=/usr/share/polkit-1/actions/io.github.mspiechowicz.platter.policy
          set -- packages/*.deb
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one deb."; exit 1; }
          listing=$(dpkg -c "$1")
          # Tauri writes the deb's entries without the leading "./" (usr/bin/platter), dpkg-deb with it.
          echo "$listing" | grep -E "^-rwxr-xr-x (root|0)/(root|0) .* (\./)?${helper#/}\$" ||
            { echo "$listing" | grep -E "platter-elevate|\.policy\$"; echo "::error::The deb does not carry $helper as root/root 0755."; exit 1; }
          echo "$listing" | grep -E "^-rw-r--r-- (root|0)/(root|0) .* (\./)?${policy#/}\$" ||
            { echo "$listing" | grep -E "platter-elevate|\.policy\$"; echo "::error::The deb does not carry $policy as root/root 0644."; exit 1; }
          # The rpm is read with rpm itself, installed here when the runner lacks it. A check that cannot run
          # fails the release instead of passing without looking.
          if ! command -v rpm >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends rpm
          fi
          command -v rpm >/dev/null 2>&1 || { echo "::error::rpm is not available, so the rpm cannot be checked."; exit 1; }
          set -- packages/*.rpm
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one rpm."; exit 1; }
          listing=$(rpm -qlvp "$1")
          echo "$listing" | grep -E "^-rwxr-xr-x .* (root|0) +(root|0) .* $helper\$" ||
            { echo "$listing" | grep -E "platter-elevate|\.policy\$"; echo "::error::The rpm does not carry $helper as root 0755."; exit 1; }
          echo "$listing" | grep -E "^-rw-r--r-- .* (root|0) +(root|0) .* $policy\$" ||
            { echo "$listing" | grep -E "platter-elevate|\.policy\$"; echo "::error::The rpm does not carry $policy as root 0644."; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packages/
          if-no-files-found: error
          retention-days: 7

  # The Windows setup. Like the Linux job it can read the repository only and sees no secret, because the
  # build scripts of dependencies run here. The default features build the advisor for the processor (Vulkan
  # is a Linux-only dependency of the desktop crate). The runner has MSVC, cmake and LLVM, which llama.cpp
  # and its bindings need.
  windows:
    name: Windows setup
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # llama.cpp's bindings (bindgen) need libclang.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Called from version.yml the run's ref is main: build exactly what the tag names.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      # The tag must name the version the setup carries (the workspace version in Cargo.toml).
      - name: Check the tag against the version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match the version $version in Cargo.toml."
            exit 1
          fi

      # See the Linux job: every build of a version is the same one.
      - name: Refuse GGML variables in the environment
        run: |
          if env | grep -qi '^GGML_'; then
            env | grep -i '^GGML_' | cut -d= -f1
            echo "::error::GGML_* variables are set. The release must be built without them."
            exit 1
          fi

      - name: Check the build tools
        run: |
          cmake --version
          [ -f "$(cygpath -u "$LIBCLANG_PATH")/libclang.dll" ] || { echo "::error::libclang.dll is not in $LIBCLANG_PATH."; exit 1; }

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install --profile minimal

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # No cache on purpose: a release is built from a clean target folder. The bundles named in
      # tauri.conf.json that Windows cannot make are skipped, so this makes the NSIS setup only.
      - name: Build the setup
        run: pnpm -C apps/desktop tauri build --ci

      - name: Collect the setup
        run: |
          mkdir packages
          cp target/release/bundle/nsis/*-setup.exe packages/
          ls -l packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows
          path: packages/
          if-no-files-found: error
          retention-days: 7

  # The Mac app (Apple Silicon). Like the others it can read the repository only and sees no secret. It is
  # signed ad hoc (tauri.conf.json: signingIdentity "-") and not notarized. Its failure does not stop the
  # release: `sign` and `publish` go on without it. The default features build the advisor for the processor
  # and, through the desktop crate's macOS dependency, for the GPU (Metal). The runner has Xcode and cmake.
  macos:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Called from version.yml the run's ref is main: build exactly what the tag names.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      # The tag must name the version the app carries (the workspace version in Cargo.toml).
      - name: Check the tag against the version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match the version $version in Cargo.toml."
            exit 1
          fi

      # See the Linux job: every build of a version is the same one.
      - name: Refuse GGML variables in the environment
        run: |
          if env | grep -q '^GGML_'; then
            env | grep '^GGML_' | cut -d= -f1
            echo "::error::GGML_* variables are set. The release must be built without them."
            exit 1
          fi

      - name: Check the build tools
        run: |
          [ "$(uname -m)" = arm64 ] || { echo "::error::The runner is not Apple Silicon."; exit 1; }
          command -v cmake >/dev/null 2>&1 || { echo "::error::cmake is missing from the macos-15 image."; exit 1; }
          cmake --version
          xcrun --find clang

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install --profile minimal
          rustup target add aarch64-apple-darwin

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # No cache on purpose: a release is built from a clean target folder. With --target the bundles are in
      # target/aarch64-apple-darwin/release/bundle. The bundles that macOS cannot make are skipped, so this
      # makes the app and the dmg.
      - name: Build the app
        run: pnpm -C apps/desktop tauri build --ci --target aarch64-apple-darwin

      # The updater takes a tarball of the app bundle. It is made here, not by Tauri, because Tauri signs its
      # own updater files with the key, which this job must not see: the sign job signs the tarball.
      - name: Collect the app and the dmg
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          bundle=target/aarch64-apple-darwin/release/bundle
          mkdir packages
          set -- "$bundle"/dmg/*.dmg
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one dmg."; exit 1; }
          cp "$1" packages/
          [ -d "$bundle/macos/Platter.app" ] || { echo "::error::The build made no Platter.app."; exit 1; }
          app="$bundle/macos/Platter.app"
          codesign --verify --deep --strict "$app"
          # The hardened runtime must be on (flags=0x10002(adhoc,runtime)), with no entitlement that weakens it.
          codesign -d --verbose=2 "$app" 2>&1 | grep -E '^CodeDirectory .*flags=.*runtime' ||
            { echo "::error::The app is not signed with the hardened runtime."; exit 1; }
          ! codesign -d --entitlements - "$app" 2>&1 | grep -E 'allow-dyld-environment-variables|disable-library-validation|allow-unsigned-executable-memory|disable-executable-page-protection|allow-jit|get-task-allow' ||
            { echo "::error::The app has an entitlement that weakens the hardened runtime."; exit 1; }
          COPYFILE_DISABLE=1 tar -czf "packages/Platter_${TAG#v}_aarch64.app.tar.gz" -C "$bundle/macos" Platter.app
          ls -l packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-macos
          path: packages/
          if-no-files-found: error
          retention-days: 7

  # The signing key is only ever in this job, which builds nothing. The one program from a dependency that
  # runs with the key is the Tauri CLI, which signs the AppImage, the Windows setup and the Mac app tarball: the desktop
  # package's dependencies are installed from pnpm-lock.yaml (integrity hashes checked, no install scripts
  # run) before the key is set, and the CLI is then started directly, not through pnpm (whose `exec` may
  # install again, with scripts, when it finds the dependencies out of date). The app checks
  # every update against the public key in tauri.conf.json, so only a file signed here is installed.
  sign:
    name: Sign and describe the update
    # The Mac build is optional: this job runs, and signs what there is, when it failed. Linux and Windows
    # must have succeeded.
    needs: [linux, windows, macos]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Called from version.yml the run's ref is main: build exactly what the tag names.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Refuse a build without the update key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if grep -q PLATTER_UPDATER_PUBKEY_NOT_SET apps/desktop/src-tauri/tauri.conf.json; then
            echo "::error::The updater's public key is not set in tauri.conf.json."
            exit 1
          fi
          if [ -z "$KEY" ]; then
            echo "::error::The secret TAURI_SIGNING_PRIVATE_KEY is not set."
            exit 1
          fi

      # Each build has a folder of its own: a file of one build can never stand in for one of the other.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: linux

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-windows
          path: windows

      # Only a Mac build that passed is used.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.macos.result == 'success'
        with:
          name: packages-macos
          path: macos

      # Before anything is signed: exactly one AppImage (with the deb and the rpm) from the Linux build and
      # exactly one setup, and nothing else, from the Windows build.
      - name: Check what the builds made
        run: |
          set -- linux/*.AppImage
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one AppImage from the Linux build."; exit 1; }
          set -- linux/*.deb
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one deb from the Linux build."; exit 1; }
          set -- linux/*.rpm
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one rpm from the Linux build."; exit 1; }
          set -- windows/*
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one file from the Windows build."; exit 1; }
          case $1 in
            windows/*-setup.exe) ;;
            *) echo "::error::The Windows build made $1, not a setup."; exit 1 ;;
          esac

      # The Mac build is optional. If it did not pass, or made anything but one dmg and one app tarball, its
      # folder is removed and the release goes out without it: from here on the folder `macos` means "the
      # Mac build is part of this release".
      - name: Check what the Mac build made
        env:
          MAC_RESULT: ${{ needs.macos.result }}
        run: |
          if [ "$MAC_RESULT" != success ]; then
            echo "::warning::The Mac build did not succeed ($MAC_RESULT). The release goes out without it."
            rm -rf macos
            exit 0
          fi
          dmgs=$(find macos -maxdepth 1 -name '*.dmg' | wc -l)
          tars=$(find macos -maxdepth 1 -name '*.app.tar.gz' | wc -l)
          files=$(find macos -mindepth 1 | wc -l)
          if [ "$dmgs" -ne 1 ] || [ "$tars" -ne 1 ] || [ "$files" -ne 2 ]; then
            echo "::warning::The Mac build made something other than one dmg and one app tarball. The release goes out without it."
            ls -l macos
            rm -rf macos
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Before the key is in the environment: the packages of the lockfile, checked against its hashes,
      # without running any package's install scripts.
      - name: Install the Tauri CLI from the lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts --filter platter-desktop-ui

      - name: Sign the AppImage, the setup and the Mac app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for file in linux/*.AppImage windows/*-setup.exe macos/*.app.tar.gz; do
            [ -f "$file" ] || continue
            apps/desktop/node_modules/.bin/tauri signer sign "$file"
          done
          ls -l linux windows
          if [ -d macos ]; then ls -l macos; fi

      # Only the files that were checked and signed go into the release.
      - name: Assemble the release
        run: |
          mkdir release
          cp linux/*.AppImage linux/*.AppImage.sig linux/*.deb linux/*.rpm release/
          cp windows/*-setup.exe windows/*-setup.exe.sig release/
          if [ -d macos ]; then
            cp macos/*.dmg macos/*.app.tar.gz macos/*.app.tar.gz.sig release/
          fi
          # The deb and the rpm once more under names without the version, so that
          # releases/latest/download/<name> always names the newest one (the install commands in README.md).
          cp linux/*.deb release/platter_amd64.deb
          cp linux/*.rpm release/platter.x86_64.rpm
          if [ -d macos ]; then
            cp macos/*.dmg release/Platter_aarch64.dmg
          fi
          ls -l release

      # The release notes are the message of the annotated tag (git tag -a v0.2.0 -m "..."), one line each.
      # latest.json is what the app reads: the version, the notes and the signed files. Both Linux keys point
      # at the AppImage, so a deb or rpm install also learns of the update (it is not installed there, the
      # app shows the release page). Both Windows keys point at the setup: the updater looks for
      # windows-x86_64-nsis first (the copy the setup installed) and then for windows-x86_64.
      - name: Write latest.json, the notes and SHA256SUMS
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref "refs/tags/$TAG" --format='%(contents:subject)%0a%(contents:body)' |
            sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "Platter ${TAG#v}" > notes.md
          fi
          cat notes.md

          cp install.sh install.ps1 release/
          set -- release/*.AppImage
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one AppImage."; exit 1; }
          appimage=${1#release/}
          set -- release/*-setup.exe
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one Windows setup."; exit 1; }
          setup=${1#release/}
          jq -n \
            --arg version "${TAG#v}" \
            --rawfile notes notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg appimage_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$appimage" \
            --rawfile appimage_signature "release/$appimage.sig" \
            --argjson appimage_size "$(stat -c %s "release/$appimage")" \
            --arg setup_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$setup" \
            --rawfile setup_signature "release/$setup.sig" \
            --argjson setup_size "$(stat -c %s "release/$setup")" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
                "linux-x86_64-appimage": {url: $appimage_url, signature: $appimage_signature, size: $appimage_size},
                "linux-x86_64": {url: $appimage_url, signature: $appimage_signature, size: $appimage_size},
                "windows-x86_64-nsis": {url: $setup_url, signature: $setup_signature, size: $setup_size},
                "windows-x86_64": {url: $setup_url, signature: $setup_signature, size: $setup_size}
              }}' > release/latest.json
          if [ -d macos ]; then
            set -- release/*.app.tar.gz
            [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one Mac app tarball."; exit 1; }
            apptar=${1#release/}
            jq \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$apptar" \
              --rawfile signature "release/$apptar.sig" \
              --argjson size "$(stat -c %s "release/$apptar")" \
              '.platforms["darwin-aarch64-app"] = {url: $url, signature: $signature, size: $size}
                | .platforms["darwin-aarch64"] = .platforms["darwin-aarch64-app"]' \
              release/latest.json > latest.tmp
            mv latest.tmp release/latest.json
          fi
          cat release/latest.json

          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          mv ../notes.md .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Release
    # The sign job needs the Linux and Windows builds, and nothing is published unless both succeeded and
    # were signed. The Mac build does not count: without it the release goes out as it is (`sign` leaves its
    # files out then). `always()` keeps this job from being skipped with a failed `macos` in `needs`.
    needs: [linux, windows, macos, sign]
    if: ${{ always() && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # A tag with a suffix (v0.2.0-rc.1) is a pre-release. A tag pushed by hand makes a draft; version.yml
      # asks for the release to be published.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PUBLISH: ${{ inputs.publish == true }}
        run: |
          prerelease=
          case $TAG in
            *-*) prerelease=--prerelease ;;
          esac
          draft=--draft
          if [ "$PUBLISH" = true ]; then
            draft=
          fi
          # Builds of two versions can finish out of order: only the highest version is marked latest, which
          # is where the app finds latest.json.
          latest=
          if [ -z "$draft" ]; then
            latest=--latest
          fi
          # A failed lookup stops here: it must not make this release latest by mistake.
          published=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName --jq '.[].tagName')
          highest=$(printf '%s\n%s\n' "$published" "$TAG" | sed '/^$/d' | sort -V | tail -n 1)
          if [ -n "$latest" ] && [ "$highest" != "$TAG" ]; then
            latest=--latest=false
          fi
          (cd release && sha256sum --check SHA256SUMS)
          mv release/notes.md notes.md
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            $draft \
            $prerelease \
            $latest \
            --verify-tag \
            --title "Platter ${TAG#v}" \
            --notes-file notes.md
