name: Release

# Builds the Linux packages (AppImage, deb, rpm) and the Windows setup (NSIS, for the current user) for a
# version tag and puts them, with SHA256SUMS, on a GitHub release.
#
# Two ways in:
# - version.yml calls it after a merge to main raised the version and pushed the tag (`publish: true`: the
#   release is published at once, so installed copies are offered the update).
# - A tag pushed by hand (git tag -a v0.2.0 -m "..." && git push origin v0.2.0) makes a draft that is
#   published by hand after the packages were tried.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "The version tag to build (v0.2.0). It must already be pushed."
        required: true
        type: string
      publish:
        description: "Publish the release when every job passed, instead of leaving a draft."
        required: false
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: Linux packages
    # The oldest supported runner: the AppImage runs on systems with this glibc or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    # Dependencies' install and build scripts run here: this job can read the repository only. The release
    # is made by the next job, which runs no code from dependencies.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Called from version.yml the run's ref is main: build exactly what the tag names.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      # The tag must name the version the packages carry (the workspace version in Cargo.toml).
      - name: Check the tag against the version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match the version $version in Cargo.toml."
            exit 1
          fi

      # llama-cpp-sys-2 passes every GGML_* variable to CMake (debug and validation switches among them).
      # A release is built without any, so every build of a version is the same.
      - name: Refuse GGML variables in the environment
        run: |
          if env | grep -q '^GGML_'; then
            env | grep '^GGML_' | cut -d= -f1
            echo "::error::GGML_* variables are set. The release must be built without them."
            exit 1
          fi

      - name: Install Linux build dependencies
        run: scripts/ci/install-linux-deps.sh

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install --profile minimal

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # No cache on purpose: a release is built from a clean target folder. The AppImage does not carry the
      # Vulkan loader: the system's one matches the system's drivers, and is new enough to honour
      # VK_LOADER_LAYERS_DISABLE (the runner's 1.3.204 is not).
      - name: Build the packages
        env:
          LINUXDEPLOY_EXCLUDED_LIBRARIES: "libvulkan.so*"
        run: pnpm -C apps/desktop tauri build --ci

      - name: Collect the packages
        run: |
          mkdir packages
          cp target/release/bundle/appimage/*.AppImage packages/
          cp target/release/bundle/deb/*.deb packages/
          cp target/release/bundle/rpm/*.rpm packages/
          ls -l packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packages/
          if-no-files-found: error
          retention-days: 7

  # The Windows setup. Like the Linux job it can read the repository only and sees no secret, because the
  # build scripts of dependencies run here. The default features build the advisor for the processor (Vulkan
  # is a Linux-only dependency of the desktop crate). The runner has MSVC, cmake and LLVM, which llama.cpp
  # and its bindings need.
  windows:
    name: Windows setup
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # llama.cpp's bindings (bindgen) need libclang.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Called from version.yml the run's ref is main: build exactly what the tag names.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      # The tag must name the version the setup carries (the workspace version in Cargo.toml).
      - name: Check the tag against the version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match the version $version in Cargo.toml."
            exit 1
          fi

      # See the Linux job: every build of a version is the same one.
      - name: Refuse GGML variables in the environment
        run: |
          if env | grep -qi '^GGML_'; then
            env | grep -i '^GGML_' | cut -d= -f1
            echo "::error::GGML_* variables are set. The release must be built without them."
            exit 1
          fi

      - name: Check the build tools
        run: |
          cmake --version
          [ -f "$(cygpath -u "$LIBCLANG_PATH")/libclang.dll" ] || { echo "::error::libclang.dll is not in $LIBCLANG_PATH."; exit 1; }

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install --profile minimal

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # No cache on purpose: a release is built from a clean target folder. The bundles named in
      # tauri.conf.json that Windows cannot make are skipped, so this makes the NSIS setup only.
      - name: Build the setup
        run: pnpm -C apps/desktop tauri build --ci

      # A red Windows test must not ship a signed setup: nothing below uploads the setup unless the tests pass
      # (the sign job needs this job). It runs after the build, which made the frontend that the desktop crate
      # embeds. This job sees no secret, and the tests run the code of the workspace and its dependencies.
      - name: Test
        run: cargo test --locked --workspace

      - name: Collect the setup
        run: |
          mkdir packages
          cp target/release/bundle/nsis/*-setup.exe packages/
          ls -l packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows
          path: packages/
          if-no-files-found: error
          retention-days: 7

  # The signing key is only ever in this job, which builds nothing. The one program from a dependency that
  # runs with the key is the Tauri CLI, which signs the AppImage and the Windows setup: the desktop
  # package's dependencies are installed from pnpm-lock.yaml (integrity hashes checked, no install scripts
  # run) before the key is set, and the CLI is then started directly, not through pnpm (whose `exec` may
  # install again, with scripts, when it finds the dependencies out of date). The app checks
  # every update against the public key in tauri.conf.json, so only a file signed here is installed.
  sign:
    name: Sign and describe the update
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Called from version.yml the run's ref is main: build exactly what the tag names.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Refuse a build without the update key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if grep -q PLATTER_UPDATER_PUBKEY_NOT_SET apps/desktop/src-tauri/tauri.conf.json; then
            echo "::error::The updater's public key is not set in tauri.conf.json."
            exit 1
          fi
          if [ -z "$KEY" ]; then
            echo "::error::The secret TAURI_SIGNING_PRIVATE_KEY is not set."
            exit 1
          fi

      # Each build has a folder of its own: a file of one build can never stand in for one of the other.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: linux

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-windows
          path: windows

      # Before anything is signed: exactly one AppImage (with the deb and the rpm) from the Linux build and
      # exactly one setup, and nothing else, from the Windows build.
      - name: Check what the builds made
        run: |
          set -- linux/*.AppImage
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one AppImage from the Linux build."; exit 1; }
          set -- linux/*.deb
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one deb from the Linux build."; exit 1; }
          set -- linux/*.rpm
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one rpm from the Linux build."; exit 1; }
          set -- windows/*
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one file from the Windows build."; exit 1; }
          case $1 in
            windows/*-setup.exe) ;;
            *) echo "::error::The Windows build made $1, not a setup."; exit 1 ;;
          esac

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Before the key is in the environment: the packages of the lockfile, checked against its hashes,
      # without running any package's install scripts.
      - name: Install the Tauri CLI from the lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts --filter platter-desktop-ui

      - name: Sign the AppImage and the setup
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for file in linux/*.AppImage windows/*-setup.exe; do
            apps/desktop/node_modules/.bin/tauri signer sign "$file"
          done
          ls -l linux windows

      # Only the files that were checked and signed go into the release.
      - name: Assemble the release
        run: |
          mkdir release
          cp linux/*.AppImage linux/*.AppImage.sig linux/*.deb linux/*.rpm release/
          cp windows/*-setup.exe windows/*-setup.exe.sig release/
          ls -l release

      # The release notes are the message of the annotated tag (git tag -a v0.2.0 -m "..."), one line each.
      # latest.json is what the app reads: the version, the notes and the signed files. Both Linux keys point
      # at the AppImage, so a deb or rpm install also learns of the update (it is not installed there, the
      # app shows the release page). Both Windows keys point at the setup: the updater looks for
      # windows-x86_64-nsis first (the copy the setup installed) and then for windows-x86_64.
      - name: Write latest.json, the notes and SHA256SUMS
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref "refs/tags/$TAG" --format='%(contents:subject)%0a%(contents:body)' |
            sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "Platter ${TAG#v}" > notes.md
          fi
          cat notes.md

          cp install.sh release/
          set -- release/*.AppImage
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one AppImage."; exit 1; }
          appimage=${1#release/}
          set -- release/*-setup.exe
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::Expected exactly one Windows setup."; exit 1; }
          setup=${1#release/}
          jq -n \
            --arg version "${TAG#v}" \
            --rawfile notes notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg appimage_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$appimage" \
            --rawfile appimage_signature "release/$appimage.sig" \
            --argjson appimage_size "$(stat -c %s "release/$appimage")" \
            --arg setup_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$setup" \
            --rawfile setup_signature "release/$setup.sig" \
            --argjson setup_size "$(stat -c %s "release/$setup")" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
                "linux-x86_64-appimage": {url: $appimage_url, signature: $appimage_signature, size: $appimage_size},
                "linux-x86_64": {url: $appimage_url, signature: $appimage_signature, size: $appimage_size},
                "windows-x86_64-nsis": {url: $setup_url, signature: $setup_signature, size: $setup_size},
                "windows-x86_64": {url: $setup_url, signature: $setup_signature, size: $setup_size}
              }}' > release/latest.json
          cat release/latest.json

          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          mv ../notes.md .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Release
    # The sign job needs both builds, and nothing is published unless both succeeded and were signed.
    needs: [linux, windows, sign]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # A tag with a suffix (v0.2.0-rc.1) is a pre-release. A tag pushed by hand makes a draft; version.yml
      # asks for the release to be published.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PUBLISH: ${{ inputs.publish == true }}
        run: |
          prerelease=
          case $TAG in
            *-*) prerelease=--prerelease ;;
          esac
          draft=--draft
          if [ "$PUBLISH" = true ]; then
            draft=
          fi
          # Builds of two versions can finish out of order: only the highest version is marked latest, which
          # is where the app finds latest.json.
          latest=
          if [ -z "$draft" ]; then
            latest=--latest
          fi
          highest=$( (gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName --jq '.[].tagName'; echo "$TAG") | sort -V | tail -n 1)
          if [ -n "$latest" ] && [ "$highest" != "$TAG" ]; then
            latest=--latest=false
          fi
          (cd release && sha256sum --check SHA256SUMS)
          mv release/notes.md notes.md
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            $draft \
            $prerelease \
            $latest \
            --verify-tag \
            --title "Platter ${TAG#v}" \
            --notes-file notes.md
