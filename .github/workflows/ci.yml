name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: scripts/ci/install-linux-deps.sh

      # rustup 1.28+ no longer installs the toolchain named in rust-toolchain.toml on first use.
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # `platter-desktop` embeds `apps/desktop/dist` at compile time (tauri `frontendDist`), so the
      # directory must exist. Lint and tests do not depend on its content, so a stub keeps this job
      # independent of Node and the frontend build, which the `web` job already covers.
      - name: Create a stub frontend dist
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><title>Platter CI stub</title>' > apps/desktop/dist/index.html

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

  web:
    name: Web (lint, check, test, build)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version` input: the action reads it from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Blocking on purpose: a high or critical advisory in a runtime (production) dependency fails the
      # build. `--prod` audits `dependencies` only: that is everything compiled into the shipped bundle
      # (svelte, three, d3-hierarchy, the Tauri API; keep it that way when adding a package). Dev-only
      # tooling is left out, it never ships.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  deny:
    name: cargo-deny
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
