name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Line tables keep file:line in panics and backtraces; full debug info only makes the build and the link
  # slower (much slower on Windows, where it is written as PDB files).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        # The script stops a hung apt itself: this is the last stop, well short of the job's limit.
        timeout-minutes: 25
        run: scripts/ci/install-linux-deps.sh

      # rustup 1.28+ no longer installs the toolchain named in rust-toolchain.toml on first use.
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Also after a failed run: the next run then starts from the built dependencies, not from nothing.
          cache-on-failure: true

      # `platter-desktop` embeds `apps/desktop/dist` at compile time (tauri `frontendDist`), so the
      # directory must exist. Lint and tests do not depend on its content, so a stub keeps this job
      # independent of Node and the frontend build, which the `web` job already covers.
      - name: Create a stub frontend dist
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><title>Platter CI stub</title>' > apps/desktop/dist/index.html

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      # The macOS code of the crates that have any, type-checked and linted on this runner without a Mac. The
      # desktop and advisor crates are left out: they build llama.cpp, which needs a Mac's toolchain (see the
      # `macos` job).
      - name: Clippy for macOS (cross check)
        run: |
          rustup target add aarch64-apple-darwin
          cargo clippy --locked --target aarch64-apple-darwin \
            -p platter-core -p platter-platform -p platter-rules -p platter-cleanup -p platter-cli \
            --all-targets -- -D warnings

  # The Windows port (P1), required like `rust`: a red Windows run makes no release (version.yml waits for CI).
  # Clippy and the tests run as two jobs side by side: almost all of the time is compiling (llama.cpp with
  # MSVC among it), so splitting the tests further would only compile the same things more often.
  windows:
    name: Windows (${{ matrix.check }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, test]
    env:
      # llama.cpp's bindings (bindgen) need libclang. The runner has LLVM, cmake and MSVC installed.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails at once, with a plain message, where the build would otherwise fail deep inside llama.cpp.
      - name: Check the build tools
        run: |
          cmake --version
          [ -f "$(cygpath -u "$LIBCLANG_PATH")/libclang.dll" ] || { echo "::error::libclang.dll is not in $LIBCLANG_PATH."; exit 1; }

      # rustup 1.28+ no longer installs the toolchain named in rust-toolchain.toml on first use.
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Also after a failed run: the next run then starts from the built dependencies, not from nothing.
          cache-on-failure: true
          # Clippy's and the tests' builds differ: each keeps a cache of its own.
          key: ${{ matrix.check }}

      # Same stub as in `rust`: `platter-desktop` embeds `apps/desktop/dist` at compile time.
      - name: Create a stub frontend dist
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><title>Platter CI stub</title>' > apps/desktop/dist/index.html

      - name: Clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        if: matrix.check == 'test'
        # A test that waits on Windows (a hidden prompt of the shell) fails the step instead of the whole job's hour.
        # The Recycle Bin tests change the bin's settings in the registry: only on this thrown-away runner.
        env:
          PLATTER_TEST_CHANGE_RECYCLE_BIN: '1'
        timeout-minutes: 25
        run: cargo test --locked --workspace --no-fail-fast

      # install.ps1 against a release folder on disk, without running the setup: a matching setup passes, a
      # changed one is refused. Once in PowerShell 7 and once in the Windows PowerShell 5.1 most PCs have.
      - name: Install script (PowerShell 7 and 5.1)
        if: matrix.check == 'test'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:RUNNER_TEMP 'fake-release'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Set-Content -LiteralPath (Join-Path $release 'Platter_9.9.9_x64-setup.exe') -Value 'not a real setup'
          $hash = (Get-FileHash -LiteralPath (Join-Path $release 'Platter_9.9.9_x64-setup.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $release 'SHA256SUMS') -Value "$hash  Platter_9.9.9_x64-setup.exe"
          $env:PLATTER_RELEASE_URL = $release
          $env:PLATTER_INSTALL_DRY_RUN = '1'

          foreach ($shell in 'pwsh', 'powershell') {
            & $shell -NoProfile -ExecutionPolicy Bypass -File install.ps1
            if ($LASTEXITCODE -ne 0) { throw "$($shell): a matching setup was refused." }
          }

          Add-Content -LiteralPath (Join-Path $release 'Platter_9.9.9_x64-setup.exe') -Value 'changed'
          foreach ($shell in 'pwsh', 'powershell') {
            & $shell -NoProfile -ExecutionPolicy Bypass -File install.ps1
            if ($LASTEXITCODE -eq 0) { throw "$($shell): a changed setup was accepted." }
          }
          Write-Host 'install.ps1: checked in both shells.'
          # The last run above failed on purpose; its exit code must not become the step's.
          exit 0

  # The macOS port (P2, Apple Silicon only), required like `rust` and `windows` since its first green run
  # (PR #9). Clippy and the tests run as two jobs side by side, as on Windows. The runner has Xcode (clang, the Metal framework) and
  # cmake, which llama.cpp and its bindings need.
  macos:
    name: macOS (${{ matrix.check }})
    runs-on: macos-15
    timeout-minutes: 60
    # Built for the oldest macOS the app supports (`minimumSystemVersion` in tauri.conf.json), as the
    # release is: version checks in llama.cpp's Metal code then happen at run time, which needs clang's
    # runtime library at link time (see crates/platter-ai/build.rs).
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails at once, with a plain message, where the build would otherwise fail deep inside llama.cpp.
      - name: Check the build tools
        run: |
          uname -m
          command -v cmake >/dev/null 2>&1 || { echo "::error::cmake is missing from the macos-15 image."; exit 1; }
          cmake --version
          xcrun --find clang

      # rustup 1.28+ no longer installs the toolchain named in rust-toolchain.toml on first use.
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Also after a failed run: the next run then starts from the built dependencies, not from nothing.
          cache-on-failure: true
          # Clippy's and the tests' builds differ: each keeps a cache of its own.
          key: ${{ matrix.check }}

      # Same stub as in `rust`: `platter-desktop` embeds `apps/desktop/dist` at compile time.
      - name: Create a stub frontend dist
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><title>Platter CI stub</title>' > apps/desktop/dist/index.html

      - name: Clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        if: matrix.check == 'test'
        # A test that waits on macOS (a prompt for a folder, a helper that never exits) fails the step instead
        # of the whole job's hour.
        timeout-minutes: 25
        run: cargo test --locked --workspace --no-fail-fast

      # install.sh's macOS branch against a release folder on disk: a matching app is installed, replaced and
      # removed, and a changed one is refused.
      - name: Install script
        if: matrix.check == 'test'
        run: scripts/ci/test-install-mac.sh

  web:
    name: Web (lint, check, test, build)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version` input: the action reads it from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Blocking on purpose: a high or critical advisory in a runtime (production) dependency fails the
      # build. `--prod` audits `dependencies` only: that is everything compiled into the shipped bundle
      # (svelte, three, d3-hierarchy, the Tauri API; keep it that way when adding a package). Dev-only
      # tooling is left out, it never ships.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  deny:
    name: cargo-deny
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
