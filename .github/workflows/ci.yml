name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Line tables keep file:line in panics and backtraces; full debug info only makes the build and the link
  # slower (much slower on Windows, where it is written as PDB files).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: scripts/ci/install-linux-deps.sh

      # rustup 1.28+ no longer installs the toolchain named in rust-toolchain.toml on first use.
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Also after a failed run: the next run then starts from the built dependencies, not from nothing.
          cache-on-failure: true

      # `platter-desktop` embeds `apps/desktop/dist` at compile time (tauri `frontendDist`), so the
      # directory must exist. Lint and tests do not depend on its content, so a stub keeps this job
      # independent of Node and the frontend build, which the `web` job already covers.
      - name: Create a stub frontend dist
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><title>Platter CI stub</title>' > apps/desktop/dist/index.html

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

  # The Windows port (P1). Not required yet: `continue-on-error` keeps a red run from blocking merges until the
  # first green run. Remove it then, and this job is required like `rust`.
  windows:
    name: Windows (clippy, test)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    env:
      # llama.cpp's bindings (bindgen) need libclang. The runner has LLVM, cmake and MSVC installed.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails at once, with a plain message, where the build would otherwise fail deep inside llama.cpp.
      - name: Check the build tools
        run: |
          cmake --version
          [ -f "$(cygpath -u "$LIBCLANG_PATH")/libclang.dll" ] || { echo "::error::libclang.dll is not in $LIBCLANG_PATH."; exit 1; }

      # rustup 1.28+ no longer installs the toolchain named in rust-toolchain.toml on first use.
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Also after a failed run: the next run then starts from the built dependencies, not from nothing.
          cache-on-failure: true

      # Same stub as in `rust`: `platter-desktop` embeds `apps/desktop/dist` at compile time.
      - name: Create a stub frontend dist
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><title>Platter CI stub</title>' > apps/desktop/dist/index.html

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --no-fail-fast

  web:
    name: Web (lint, check, test, build)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version` input: the action reads it from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Blocking on purpose: a high or critical advisory in a runtime (production) dependency fails the
      # build. `--prod` audits `dependencies` only: that is everything compiled into the shipped bundle
      # (svelte, three, d3-hierarchy, the Tauri API; keep it that way when adding a package). Dev-only
      # tooling is left out, it never ships.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  deny:
    name: cargo-deny
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
