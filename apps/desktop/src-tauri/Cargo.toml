[package]
name = "platter-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Platter desktop app: a thin Tauri IPC layer over platter-core and platter-platform."
build = "build.rs"

[lints]
workspace = true

[features]
# The advisor model (llama.cpp, built from source: needs cmake and clang). Without it the advisor
# reports itself as `unavailable` and nothing else changes.
default = ["advisor"]
advisor = ["platter-ai/llama"]
# The advisor on the graphics card too (Vulkan; needs the Vulkan headers and `glslc` to build). Linux only:
# the Linux build gets it from the target dependency below (the binary links libvulkan.so.1, so packages
# depend on the Vulkan loader; owner decision 2026-11-17), and a Windows build with this feature does not
# compile (the advisor runs on the processor there; P1).
gpu-vulkan = ["advisor", "platter-ai/gpu-vulkan"]

[lib]
name = "platter_desktop_lib"

[[bin]]
name = "platter"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
platter-core.workspace = true
platter-platform.workspace = true
platter-rules.workspace = true
platter-cleanup.workspace = true
platter-history.workspace = true
platter-ai.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-updater.workspace = true


# The cleanup confirmation is built with the GTK that Tauri already runs on (same version, no new
# library): it can name its own window title, attach to the app window and default to Cancel.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# The advisor's graphics card support is part of every Linux build (`default` has no `gpu-vulkan` so that
# a Windows build with the default features compiles). `llama` comes with it.
platter-ai = { workspace = true, features = ["gpu-vulkan"] }

[dev-dependencies]
platter-core = { workspace = true, features = ["testing"] }
platter-platform = { workspace = true, features = ["testing"] }
platter-ai = { workspace = true, features = ["testing"] }
platter-history = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tauri = { workspace = true, features = ["test"] }
