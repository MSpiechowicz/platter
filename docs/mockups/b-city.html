<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platter — Explorer</title><link rel="stylesheet" href="shared.css">
<style>
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
.crumbs{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:13px;flex-wrap:wrap}
.crumbs button{color:var(--cyan);padding:3px 7px;border-radius:6px}.crumbs button:hover{background:#3ec5d81a}
.stage{display:flex;flex-direction:column;gap:12px;min-height:680px}
.nav2{display:flex;gap:6px;align-items:center}
.nav2 .btn{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;font-size:12.5px;line-height:1.3}
.nav2 svg{transform:translateY(-1px);width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav2 .hint{margin-left:auto;font-size:12px;color:var(--dim)}
.mapbox{flex:1;min-height:520px;position:relative;overflow:hidden;border-radius:6px}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:0 0}
#map.zin{animation:zin .45s cubic-bezier(.2,.8,.2,1)}
#map.zout{animation:zout .35s cubic-bezier(.2,.8,.2,1)}
@keyframes zin{from{transform:translate(var(--tx),var(--ty)) scale(var(--sx),var(--sy));opacity:.35}}
@keyframes zout{from{transform:scale(1.12);transform-origin:50% 50%;opacity:0}}
#map .n{cursor:pointer;transition:opacity .2s}
#map .n rect{transition:filter .15s}
#map .n.hot>rect{filter:brightness(1.3)}
#map.has-sel .n:not(.sel){opacity:.32}
#map .n.sel.top>rect{stroke:#fff;stroke-width:2;stroke-opacity:1}
#map .n.mk.top>rect{stroke:#fff;stroke-width:2;stroke-opacity:1;stroke-dasharray:6 4}
#map text{font-family:var(--font);fill:#fff;pointer-events:none}
#map text.nm{font-family:var(--mono);font-weight:600;font-size:13px}
#map text.sz{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:20px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:7px}.legend .sp{flex:1}
.legend .k{display:block;width:16px;height:11px;border-radius:3px;border:1.5px solid var(--green)}.legend .k.mk{border:1.5px dashed var(--text)}.legend .k.sl{border-color:#fff;background:#ffffff1f}
.det h2{font-family:var(--mono);font-size:16px;word-break:break-all}
.det .big{font-size:30px;font-weight:700;margin:6px 0}
.why{font-size:12.5px;color:var(--muted);margin:10px 0 12px}
.cont{flex:1;display:flex;flex-direction:column;min-height:300px}
.clist{flex:1;min-height:0;overflow:auto;padding-right:12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.crow{display:grid;grid-template-columns:16px minmax(0,1fr) 64px 56px;gap:10px;align-items:center;padding:10px 0;font-size:13px;cursor:pointer}
.crow+.crow{border-top:1px solid var(--line)}
.crow input{accent-color:var(--accent);margin:0 0 0 -2px}
.crow .lock{width:14px;height:14px;fill:none;stroke:var(--dim);stroke-width:1.5;stroke-linecap:round;margin-left:-1px}
.crow .kept{font-family:var(--font);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-left:8px}
.crow .nm{font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .bar{margin:0;height:4px}.crow .bar i{background:var(--c)}
.crow b{text-align:right}
.crow:hover .nm,.crow.sel .nm{color:#fff}.crow.sel{background:#ffffff0a;box-shadow:-8px 0 #ffffff0a,8px 0 #ffffff0a}
.total{margin-top:12px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px}
.total b{font-size:22px}.total small{display:block;font-size:12px;color:var(--muted)}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}.stage{min-height:520px}.mapbox{min-height:400px}}
.det h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.det .why{min-height:2.9em;line-height:1.45}.det .btn{flex:1;white-space:nowrap}.det .btn:disabled{opacity:.4;cursor:default}
.vsw{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-left:12px}.vsw button{padding:6px 14px;font-size:12.5px;color:var(--muted)}.vsw button+button{border-left:1px solid var(--line)}.vsw button.on{background:#ffffff14;color:var(--text)}
#v3{position:absolute;inset:0;cursor:grab;user-select:none;touch-action:none}#v3.drag{cursor:grabbing}#v3 canvas{display:block}
#lead,#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}#lead{width:100%;height:100%}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;line-height:1.25;color:#fff;background:#0a0e17d9;border:1px solid #ffffff22;border-radius:5px;padding:3px 7px;text-align:center;transition:opacity .2s}
.lb b{font-family:var(--mono);font-weight:600;display:block}.lb span{color:#c3cbd9}.lb.dim{opacity:.35}.lb.sel{border-color:#fff!important}.lb.mk{border-style:dashed;border-color:#fff!important}
.how{position:absolute;left:0;bottom:0;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);pointer-events:none}
.how svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="app"><div id="side"></div>
<main class="main">
  <div class="top"><div><h1 class="hud-title">EXPLORER</h1><div class="crumbs" id="crumbs"></div></div></div>
  <div class="wrap">
    <div class="card stage">
      <div class="nav2"><button class="btn" id="up"><svg viewBox="0 0 16 16"><path d="M13 8H3M7 4L3 8l4 4"/></svg><span>Back</span></button><button class="btn" id="root"><svg viewBox="0 0 16 16"><path d="M2.5 7.5L8 3l5.5 4.5M4 6.5V13h8V6.5"/></svg>Whole disk</button><span class="hint">Click a folder to select it, click again to open it</span><div class="vsw" id="vsw"><button class="on" data-v="flat">Flat</button><button data-v="3d">3D</button></div></div>
      <div class="mapbox" id="mapbox"><svg id="map"></svg><div id="v3" hidden><svg id="lead"></svg><div id="labels"></div><div class="how"><svg viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4M2.5 2.5V5H5"/></svg>Drag to rotate · scroll to zoom</div></div></div>
      <div class="legend"><span id="lgk">Bigger tile = more space</span><span class="sp"></span><span><i class="k safe"></i>Safe to clean</span><span><i class="k mk"></i>Marked for cleanup</span><span><i class="k sl"></i>Selected</span></div></div>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <div class="card det" id="det"></div>
      <div class="card cont"><h3>In this folder <span class="sp"></span><span class="ai" id="ccnt"></span></h3><div class="clist" id="clist"></div>
        <div class="total"><div><div class="muted" style="font-size:11px;letter-spacing:.12em">MARKED FOR CLEANUP</div><b class="num" id="btot">0</b><small id="bst"></small></div><div class="sp"></div><button class="btn pri" id="clean" disabled>Clean</button></div></div>
    </div>
  </div>
</main></div>
<script src="shared.js"></script><script src="d3.min.js"></script>
<script>
$('#side').outerHTML = sidebar('Explorer');
const BG = '#0a0e17', GREEN = '#4fb286', map = $('#map'), box = $('#mapbox'), mix = (c, p) => `color-mix(in srgb, ${c} ${p}%, ${BG})`;

function conv(nd, depth = 0) {   // the sample data is shallow, so big leaves are split into made-up sub-folders

  if (nd.children) o.children = nd.children.map(c => conv(c, depth + 1));

    o.children = w.map((x, i) => conv({ name: names[i], size: nd.size * x / t, color: nd.color, ai: nd.ai }, depth + 1)); }
  return o;
}
const weigh = n => n.sum(d => d.children ? 0 : d.size).sort((a, b) => b.value - a.value);
const root = weigh(d3.hierarchy(conv(TREE)));
root.eachAfter(n => n.v = n.children ? (n.children.every(c => c.v === 'safe') ? 'safe' : n.children.some(c => c.v !== 'keep') ? 'review' : 'keep') : n.data.ai);

let focus = root.children[0], sel = null, hov = null, marked = [], tiles = [];

// ---------- nested map ----------

    const size = fmt(n.value), tag = safeTop ? 'SAFE · ' : '', right = head && w > n.data.name.length * 7.9 + (tag.length + size.length) * 6.6 + 34, name = fit(n.data.name, w - 16 - (right ? (tag.length + size.length) * 6.6 + 12 : 0));

      (head ? (name ? `<text class="nm" x="${d.x0 + 8}" y="${d.y0 + 17}">${name}</text>` + (right ? `<text class="sz" x="${d.x1 - 8}" y="${d.y0 + 17}" text-anchor="end">${safeTop ? `<tspan fill="${GREEN}" font-weight="700" font-size="10.5" letter-spacing=".06em">SAFE</tspan> · ` : ''}${size}</text>` : '') : '')

}
map.onclick = () => { if (sel) { sel = null; paintSel(); detail(); } };
new ResizeObserver(() => { drawMap(); paintSel(); paintMarks(); }).observe(box);

  else map.classList.add('zout');
}

// ---------- page ----------
function render() {

  $('#crumbs').innerHTML = chain.map((p, i) => `<button data-i="${i}">${i ? p.data.name : DISK.mount}</button>`).join('<span class="muted">›</span>') + `<span class="muted" style="margin-left:8px">${fmt(focus.value)}</span>`;
  $$('#crumbs button').forEach(b => b.onclick = () => { const n = chain[b.dataset.i]; if (n !== focus) zoomTo(n, true); });
  $('#up').disabled = $('#root').disabled = !focus.parent; $('#up span').textContent = focus.parent ? 'Back to ' + (focus.parent.parent ? focus.parent.data.name : '/') : 'Back';

}
function choose(n) { if (n.children && sel === n) return zoomTo(n); sel = n; paintSel(); detail(); }

function detail() {
  const nd = sel || focus, on = marked.includes(nd);
  $('#det').innerHTML = `<h3>${sel ? 'Selected' : 'Current folder'}</h3><h2>${pathStr(nd)}</h2><div class="big num">${fmt(nd.value)}</div>
    <span class="tag ${nd.v}">${nd.v}</span><div class="why">${WHY[nd.v]}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="enter" ${sel && sel.children ? '' : 'disabled'}>Open folder</button><button class="btn ${on ? '' : 'pri'}" id="add" ${sel && nd.v !== 'keep' ? '' : 'disabled'}>${on ? 'Unmark' : 'Mark for cleanup'}</button></div>`;

  if ($('#add')) $('#add').onclick = () => mark(nd, !on);
}
function list() {
  const kids = focus.children, max = kids[0].value;
  $('#ccnt').textContent = kids.length + ' items';
  $('#clist').innerHTML = kids.map((k, i) => `<div class="crow" data-n="${i}" style="--c:${k.data.color}">${k.v === 'keep' ? '<svg class="lock" viewBox="0 0 16 16"><title>Kept by the advisor, cannot be marked</title><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>' : '<input type="checkbox">'}<div class="nm">${k.data.name}${k.v === 'keep' ? '<span class="kept">kept</span>' : ''}</div><div class="bar"><i style="width:${k.value / max * 100}%"></i></div><b class="num">${fmt(k.value)}</b></div>`).join('');

function paintSel() {

function paintMarks() {

  $$('.crow input').forEach(cb => cb.checked = marked.includes(focus.children[cb.closest('.crow').dataset.n]));

  countUp($('#btot'), sum(marked), fmt, 300); $('#clean').disabled = !marked.length; $('#clean').textContent = marked.length ? `Clean (${marked.length})` : 'Clean';

function doClean(items) { const t = sum(items); items.forEach(n => n.leaves().forEach(l => l.data.size *= .02)); weigh(root); marked = []; sel = null; render(); toast(`Freed ${fmt(t)}`, 'The map has been redrawn without the cleaned folders.'); }

    ${rev.map(m => `<div class="di"><span class="mono" style="font-size:12.5px;color:var(--text)">${pathStr(m)}</span><b class="num">${fmt(m.value)}</b><small>${WHY.review}</small></div>`).join('')}

    <div class="dbtn"><button class="btn" data-a="cancel" autofocus>Cancel</button><button class="btn pri" data-a="ok">Clean ${fmt(sum(marked))}</button></div></dialog>`);

// ---------- 3D columns: a second view of the same folder ----------
// Each folder is a column of equal height, its floors are the sub-folders, so volume equals size.

}
function build3d() {
  const bg = new THREE.Color(BG), shade = (c, p) => bg.clone().lerp(new THREE.Color(c), p / 100), PCT = [0, 34, 52, 72];

    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), new THREE.LineBasicMaterial({ color: safe ? new THREE.Color(GREEN) : shade(col, Math.min(100, PCT[depth] + 26)), transparent: true, opacity: m.userData.eo }))); };

  const s = weigh(focus.copy()), H = 34, G = .55; d3.treemap().size([84, 84]).paddingInner(3).round(false)(s);
