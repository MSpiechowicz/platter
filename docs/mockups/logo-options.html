<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platter — Logo options</title><link rel="stylesheet" href="shared.css">
<style>
body{padding:22px 26px}
h1{font-size:16px;letter-spacing:.1em;font-family:var(--mono);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px;max-width:1300px}
.lc h3{display:flex;align-items:center;gap:8px}
.rec{font-size:10px;border:1px solid var(--green);color:var(--green);border-radius:4px;padding:1px 5px;font-weight:700;letter-spacing:0}
.lc p{font-size:12.5px;color:var(--muted);margin:0 0 14px;min-height:36px}
.hero{display:grid;place-items:center;height:170px;border-radius:8px;background:#0a0e17;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;margin-top:14px;min-height:64px}
.cap{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:14px}
.lock{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:15px}
.lock.lo{letter-spacing:0;font-size:19px;font-weight:600;text-transform:lowercase}
.lock.light{background:#eef1f6;color:#0f1622;border-radius:8px;padding:10px 14px}
.tile{display:grid;place-items:center;border-radius:22%;background:#16202f;border:1px solid #2a3547;flex:none}
.tile.acc{background:#3ec5d8;border-color:#3ec5d8}
.sp{flex:1}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
</style></head><body>
<h1>PLATTER · SIX LOGO OPTIONS</h1><div class="muted" style="font-size:13px">Each is shown large, next to the name as it would sit in the sidebar, and as an app icon at 64, 32 and 16 px.</div>
<div class="grid" id="grid"></div>
<script src="shared.js"></script>
<script>
const P = (r, a) => `${(24 + r * Math.cos(a * Math.PI / 180)).toFixed(2)},${(24 + r * Math.sin(a * Math.PI / 180)).toFixed(2)}`;
const sect = (r0, r1, a0, a1) => `M${P(r1, a0)}A${r1},${r1} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${P(r1, a1)}L${P(r0, a1)}A${r0},${r0} 0 ${a1 - a0 > 180 ? 1 : 0} 0 ${P(r0, a0)}Z`;
const arc = (r, a0, a1) => `M${P(r, a0)}A${r},${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${P(r, a1)}`;
// f = main colour, a = accent
const MARKS = [
  ['Slice', 'A disk seen from above with one piece pulled out: the space you get back. Reads at any size.', 1, (f, a) => `<path d="${sect(7, 20, -18, 282)}" fill="${f}"/><path d="${sect(7, 20, 296, 328)}" fill="${a}" transform="translate(3.4,-3.4)"/>`],
  ['Stack', 'The current idea, made bolder: three solid platters, the top one sliding off.', 0, (f, a) => `<ellipse cx="22" cy="35" rx="17" ry="6.5" fill="${f}" opacity=".38"/><ellipse cx="22" cy="25.5" rx="17" ry="6.5" fill="${f}" opacity=".7"/><ellipse cx="27" cy="14.5" rx="17" ry="6.5" fill="${a}"/>`],
  ['Letter P', 'The letter P, where the bowl is a platter with its spindle hole. Works as a monogram.', 0, (f, a) => `<rect x="9" y="6" width="7" height="36" rx="2" fill="${f}"/><circle cx="26" cy="19" r="10" fill="none" stroke="${a}" stroke-width="7"/>`],
  ['Drive', 'A hard-drive platter with its read arm. The most literal "disk tool" mark.', 0, (f, a) => `<circle cx="22" cy="22" r="17" fill="none" stroke="${f}" stroke-width="4"/><circle cx="22" cy="22" r="4.5" fill="${f}"/><path d="M41 41L30.5 30.5" stroke="${a}" stroke-width="5" stroke-linecap="round"/><circle cx="41" cy="41" r="4" fill="${a}"/>`],
  ['Map', 'The Explorer map inside a disk: blocks of different sizes, one highlighted.', 0, (f, a, id) => `<clipPath id="c${id}"><circle cx="24" cy="24" r="20"/></clipPath><g clip-path="url(#c${id})"><rect x="2" y="2" width="20" height="25" fill="${f}"/><rect x="2" y="29.5" width="20" height="17" fill="${f}" opacity=".55"/><rect x="24.5" y="2" width="22" height="14" fill="${f}" opacity=".55"/><rect x="24.5" y="18.5" width="22" height="13" fill="${a}"/><rect x="24.5" y="34" width="22" height="12" fill="${f}" opacity=".8"/></g>`],
  ['Tracks', 'Three tracks of a disk, each filled to a different level, like a usage gauge.', 0, (f, a) => `<path d="${arc(19, -90, 180)}" fill="none" stroke="${a}" stroke-width="5.5" stroke-linecap="round"/><path d="${arc(11.5, -90, 95)}" fill="none" stroke="${f}" stroke-width="5.5" stroke-linecap="round" opacity=".75"/><circle cx="24" cy="24" r="3.6" fill="${f}" opacity=".45"/>`],
];
const svg = (m, i, s, f = '#e6ebf5', a = '#3ec5d8') => `<svg width="${s}" height="${s}" viewBox="0 0 48 48">${m[3](f, a, i + '-' + s + f.slice(1))}</svg>`;
const tile = (m, i, s, acc) => `<div class="tile ${acc ? 'acc' : ''}" style="width:${s}px;height:${s}px">${svg(m, i, Math.round(s * .66), acc ? '#06141a' : undefined, acc ? '#ffffff' : undefined)}</div>`;
$('#grid').innerHTML = MARKS.map((m, i) => `<div class="card lc"><h3>${i + 1} · ${m[0]} ${m[2] ? '<span class="rec">RECOMMENDED</span>' : ''}</h3><p>${m[1]}</p>
  <div class="hero">${svg(m, i, 112)}</div>
  <div class="cap">With the name</div><div class="row"><div class="lock">${svg(m, i, 26)}PLATTER</div><div class="lock lo">${svg(m, i, 26)}platter</div><span class="sp"></span><div class="lock light">${svg(m, i, 22, '#0f1622', '#1798ad')}PLATTER</div></div>
  <div class="cap">App icon</div><div class="row">${tile(m, i, 64)}${tile(m, i, 32)}${tile(m, i, 16)}<span class="sp"></span>${tile(m, i, 64, 1)}${tile(m, i, 32, 1)}</div></div>`).join('');
</script></body></html>
